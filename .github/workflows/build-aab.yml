name: Build Release AAB and APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Build Environment & Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # Generate gradlew wrapper if not present
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x gradlew

          # Ensure .env file exists for secrets plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

          # Decode Release Keystore if provided in GitHub Secrets
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "[INFO] Decoding production release keystore from GitHub Secret RELEASE_KEYSTORE_BASE64..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            echo "[INFO] No RELEASE_KEYSTORE_BASE64 secret provided. Falling back to default keystore..."
            if [ ! -f "debug.keystore" ]; then
              keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Aakasi, OU=App, O=Aakasi, C=US"
            fi
          fi

      - name: Build Release Bundle (AAB) and APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease :app:assembleDebug --no-daemon

      - name: Locate Built Files
        run: |
          echo "=== Release AAB (Google Play) ==="
          find app/build/outputs/bundle -name "*.aab" || true
          echo "=== Release & Debug APKs ==="
          find app/build/outputs/apk -name "*.apk" || true

      - name: Upload Release AAB (Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: aakasi-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release APK (Device Install)
        uses: actions/upload-artifact@v4
        with:
          name: aakasi-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Debug APK (Testing)
        uses: actions/upload-artifact@v4
        with:
          name: aakasi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
