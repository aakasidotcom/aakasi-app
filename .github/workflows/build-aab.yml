name: Build Release AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "[INFO] Decoding production release keystore from GitHub Secret RELEASE_KEYSTORE_BASE64..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            echo "[INFO] No RELEASE_KEYSTORE_BASE64 secret provided. Falling back to default debug keystore..."
            if [ ! -f "debug.keystore" ]; then
              keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Aakasi, OU=App, O=Aakasi, C=US"
            fi
          fi

      - name: Build Release AAB Bundle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Locate AAB and APK files
        run: |
          find . -name "*.aab" -o -name "*.apk"

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aakasi-release-bundle
          path: |
            app/build/outputs/bundle/**/*.aab
            **/outputs/**/*.aab
          if-no-files-found: error
          retention-days: 7
