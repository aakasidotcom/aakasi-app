name: Build Release AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle Wrapper and Keystore Exist
        run: |
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x gradlew
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Aakasi, OU=App, O=Aakasi, C=US"
          fi

      - name: Build Release AAB Bundle
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aakasi-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 7

